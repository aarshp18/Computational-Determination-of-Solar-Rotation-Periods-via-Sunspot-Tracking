name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install ruff pytest
      - name: Run Formatter and Linter
        run: |
          ruff format --check .
          ruff check .
      - name: Run Tests
        run: pytest
